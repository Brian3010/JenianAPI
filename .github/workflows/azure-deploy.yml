# ============================================================
# azure-deploy.yml  –  CI/CD: Build → ACR → Azure Container Apps
#
# Triggered on every push to the `main` branch.
# What it does:
#   1. Checks out the code
#   2. Builds the Docker image using the multi-stage Dockerfile
#   3. Pushes the image to Azure Container Registry (ACR)
#   4. Deploys the new image to Azure Container Apps
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AZURE_CREDENTIALS          – Service principal JSON (see below)
#   REGISTRY_LOGIN_SERVER      – e.g. myregistry.azurecr.io
#   REGISTRY_USERNAME          – ACR admin username or SP client ID
#   REGISTRY_PASSWORD          – ACR admin password or SP client secret
#   AZURE_RESOURCE_GROUP       – e.g. jenian-rg
#   AZURE_CONTAINER_APP_NAME   – e.g. jenian-api
#   AZURE_CONTAINER_APP_ENV    – e.g. jenian-env
#
# How to create AZURE_CREDENTIALS:
#   az ad sp create-for-rbac \
#     --name "jenian-github-actions" \
#     --role contributor \
#     --scopes /subscriptions/<SUB_ID>/resourceGroups/<RG> \
#     --sdk-auth
#   Copy the full JSON output as the secret value.
# ============================================================

name: Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:    # allow manual runs from the GitHub UI

# Restrict the GITHUB_TOKEN to the minimum required permissions.
permissions:
  contents: read

env:
  IMAGE_NAME: jenian-api

jobs:
  build-and-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Check out source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Log in to Azure Container Registry
      # ---------------------------------------------------------
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ---------------------------------------------------------
      # 3. Build and push the Docker image
      #    - Tags image with both the Git SHA (immutable) and
      #      "latest" (convenience alias for the newest build).
      # ---------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # ---------------------------------------------------------
      # 4. Log in to Azure (needed to update Container Apps)
      # ---------------------------------------------------------
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------------
      # 5. Deploy the new image to Azure Container Apps
      #    Updates only the container image; all other settings
      #    (env vars, secrets, scaling) stay as configured in Azure.
      # ---------------------------------------------------------
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
