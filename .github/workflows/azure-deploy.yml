# ============================================================
# azure-deploy.yml  –  CI/CD: Build → ACR → Azure Container Apps
#
# Triggered on every push to the `main` branch.
# What it does:
#   1. Checks out the code
#   2. Builds the Docker image using the multi-stage Dockerfile
#   3. Pushes the image to Azure Container Registry (ACR)
#   4. Deploys the new image to Azure Container Apps
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AZURE_CREDENTIALS          – Service principal JSON
#   REGISTRY_LOGIN_SERVER      – e.g. jenianregistry.azurecr.io
#   REGISTRY_USERNAME          – ACR admin username
#   REGISTRY_PASSWORD          – ACR admin password
#   AZURE_RESOURCE_GROUP       – e.g. Jenian
#   AZURE_CONTAINER_APP_NAME   – e.g. jenian-api-v2
#
# How to create AZURE_CREDENTIALS:
#   MSYS_NO_PATHCONV=1 az ad sp create-for-rbac \
#     --name "jenian-github-actions" \
#     --role contributor \
#     --scopes /subscriptions/<SUB_ID>/resourceGroups/<RG>
#   Then manually build the JSON:
#   { "clientId": "<appId>", "clientSecret": "<password>",
#     "subscriptionId": "<SUB_ID>", "tenantId": "<tenant>" }
# ============================================================

name: Build and Deploy to Azure

on:
  push:
    branches: ['main']
  workflow_dispatch: # allow manual runs from the GitHub UI

# Restrict the GITHUB_TOKEN to the minimum required permissions
permissions:
  contents: read

env:
  IMAGE_NAME: jenian-api

jobs:
  build-and-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Check out source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Docker Buildx (required for cache support)
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 3. Log in to Azure Container Registry
      # ---------------------------------------------------------
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ---------------------------------------------------------
      # 4. Build and push the Docker image
      #    - Tags with Git SHA (immutable, traceable) and latest
      #    - Uses GitHub Actions cache to speed up rebuilds
      #      by reusing unchanged Docker layers
      # ---------------------------------------------------------
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # 5. Print image digest for traceability
      #    Useful for auditing exactly what was deployed
      # ---------------------------------------------------------
      - name: Print image digest
        run: echo "Image digest → ${{ steps.build-push.outputs.digest }}"

      # ---------------------------------------------------------
      # 6. Log in to Azure (needed to update Container Apps)
      # ---------------------------------------------------------
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------------
      # 7. Deploy the new image to Azure Container Apps
      #    Deploys the sha-tagged image (never latest) so every
      #    deployment is fully traceable back to a git commit.
      # ---------------------------------------------------------
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
