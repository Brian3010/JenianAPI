# ============================================================
# docker-compose.yml  –  Local development / testing stack
#
#
# Usage:
#   1. Copy .env.example → .env and fill in the real values
#   2. docker compose up --build
#   3. Open http://localhost:8080/swagger
#
# IMPORTANT: This file is for LOCAL TESTING ONLY.
# ============================================================

services:
  # ----------------------------------------------------------
  # Jenian API
  # ----------------------------------------------------------
  jenian-api:
    build:
      context: . # repo root (so all src/ projects are visible)
      dockerfile: Dockerfile
    container_name: jenian-api
    ports:
      - '8081:8080' # http://localhost:8081
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      # --- Database ---
      ConnectionStrings__JenianAuthConnection: 'Server=host.docker.internal,1433;Database=JenianDb;User ID=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True'
      ConnectionStrings__JenianDbConnection: 'Server=host.docker.internal,1433;Database=JenianDb;User ID=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True'

      # --- JWT ---
      jwt__Key: '${JWT_KEY}'
      jwt__Issuer: '${JWT_ISSUER}'
      jwt__Audience: '${JWT_AUDIENCE}'

      # --- External services ---
      OpenAI__ApiKey: '${OPENAI_API_KEY}'
      OpenAI__Model: 'gpt-5-nano'
      AzureVision__VisionEndpoint: '${AZURE_VISION_ENDPOINT}'
      AzureVision__VisionKey: '${AZURE_VISION_KEY}'
      Telegram__BotToken: '${TELEGRAM_BOT_TOKEN}'
      AzureBlobStorage__AccountUrl: '${AZURE_BLOB_STORAGE_ACCOUNT_URL}'
      AzureBlobStorage__ContainerName: '${AZURE_BLOB_STORAGE_CONTAINER_NAME}'
      AZURE_TENANT_ID: '${AZURE_TENANT_ID}'
      AZURE_CLIENT_ID: '${AZURE_CLIENT_ID}'
      AZURE_CLIENT_SECRET: '${AZURE_CLIENT_SECRET}'

      # --- Migrations (set to true on first run to create DB schema) ---
      RUN_MIGRATIONS: 'false'

      AuthCookies__AccessTokenMinutes: '${AuthCookies__AccessTokenMinutes}'
      AuthCookies__RefreshTokenDays: '${AuthCookies__RefreshTokenDays}'
      AuthCookies__DeviceIdDays: '${AuthCookies__DeviceIdDays}'

    restart: unless-stopped
