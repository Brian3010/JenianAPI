version: "3.9"

services:
  jenian-api:
    build: .                       # Dockerfile sits next to Program.cs & JenianAPI.csproj
    container_name: jenian-api
    ports:
      - "8080:8080"                # -> http://localhost:8080
    environment:
      # IMPORTANT: set Development so Swagger works (your Program.cs shows Swagger only in Development)
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080

      # Your DbContext asks for "JenianAuthConnection"
      # Use SQL auth + fixed TCP port exposed by your host SQL Server
      - ConnectionStrings__JenianAuthConnection

      # Match your code's config keys exactly (AzureVision:VisionEndpoint/Key)
      - AzureVision__VisionEndpoint
      - AzureVision__VisionKey

      # (Optional) If you want to override JWT/Telegram from env, use:
      - jwt__Key
      - jwt__Issuer
      - jwt__Audience
      - Telegram__BotToken
      # - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Ollama__BaseUrl
      - Ollama__Model
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
        - "11434:11434"        # DEV ONLY: exposes Ollama to your host. Remove in prod.
    volumes:
        - ollama_models:/root/.ollama  # persists downloaded models between runs
    # Optional: pre-pull a default model so first request isnt slow
    # entrypoint: >
    #     bash -lc "
    #     /bin/ollama serve &
    #     while ! wget -sf http://localhost:11434/api/version >/dev/null; do sleep 1; done;
    #     ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct} || true;
    #     wait
    #     "
    # healthcheck:
    #     test: ["CMD", "bash", "-lc", "wget -sf http://localhost:11434/api/version >/dev/null"]
    #     interval: 10s
    #     timeout: 5s
    #     retries: 10
volumes: 
    ollama_models:
